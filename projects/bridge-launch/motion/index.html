<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bridge — motion composition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <!-- Background layers -->
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grid"></div>
    <div class="vignette"></div>
  </div>

  <div id="world">
  <div id="camera">

    <!-- 1. Hook -->
    <section id="s-hook" class="scene">
      <h1 class="hook-line" id="hook1"></h1>
      <h1 class="hook-line grad" id="hook2"></h1>
    </section>

    <!-- 2. Title (the bridge mark itself lives in #mark, outside scenes) -->
    <section id="s-title" class="scene">
      <div class="eyebrow-row" id="eyebrowRow">
        <span class="badge" id="badge"></span>
        <span class="eyebrow" id="eyebrow"></span>
      </div>
      <h1 class="title-word" id="titleWord"></h1>
      <p class="subtitle" id="subtitle"></p>
    </section>

    <!-- 3. Product showcase -->
    <section id="s-show" class="scene">
      <div id="rig">
      <div class="device-glow" id="deviceGlow"></div>
      <div class="voice-glow" id="voiceGlow"></div>
      <div class="device-wrap" id="deviceWrap">
        <!-- phone frame (portrait) -->
        <div class="device phone" id="phone">
          <div class="screen" id="screen">
            <img id="recFrame" alt="">
            <div class="mock" id="mock"></div>
            <div class="tap" id="tap"></div>
          </div>
          <div class="island"></div>
          <div class="glare"></div>
        </div>
      </div>
      </div><!-- /rig -->
      <div class="callouts" id="callouts"></div>
      <div class="captions" id="captions"></div>
    </section>

    <!-- 4. Features -->
    <section id="s-feat" class="scene">
      <div class="feat-head">
        <span class="feat-eyebrow" id="featEyebrow"></span>
        <span class="feat-rule" id="featRule"></span>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- 5. Outro -->
    <section id="s-outro" class="scene">
      <h1 class="outro-title" id="outroTitle"></h1>
      <div class="cta" id="cta"><span class="cta-label" id="ctaLabel"></span><span class="cta-arrow">→</span><span class="cta-shine" id="ctaShine"></span></div>
      <p class="footnote" id="footnote"></p>
    </section>

  </div>

  <!-- The bridge mark: hero in the title, logo in the corner, hero again in the outro -->
  <div id="mark">
    <svg id="bridgeSvg" viewBox="0 0 800 300" width="800" height="300">
      <defs>
        <linearGradient id="gStroke" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="760" y2="0">
          <stop offset="0" stop-color="#3EE6C9"/>
          <stop offset="0.5" stop-color="#4C7DFF"/>
          <stop offset="1" stop-color="#9B6BFF"/>
        </linearGradient>
        <radialGradient id="gNode" cx="0.35" cy="0.35" r="0.8">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="0.35" stop-color="#7FF0DD"/>
          <stop offset="1" stop-color="#3B6BFF"/>
        </radialGradient>
        <filter id="fGlow" x="-20%" y="-60%" width="140%" height="220%">
          <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="fDot" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="bridgeGlow" filter="url(#fGlow)" opacity="0.85"></g>
      <g id="bridgeLines"></g>
      <g id="bridgeNodes"></g>
      <g id="bridgeParticles" filter="url(#fDot)"></g>
    </svg>
  </div>
  <div id="wordmark"></div>
  </div><!-- /world -->

  <div class="grain" id="grain"></div>
  <div class="fade" id="fade"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="main.js"></script>
</body>
</html>
